<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Valentine's Day ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ff5f7e, #ffc371);
      color: white;
      text-align: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-top: 100px;
      font-size: 3em;
    }

    p {
      font-size: 1.5em;
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      border: none;
      border-radius: 25px;
      background: white;
      color: #ff4d6d;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background: #ffe6eb;
    }

    .heart {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      0% {transform: translateY(-10px); opacity:1;}
      100% {transform: translateY(100vh); opacity:0;}
    }
  </style>
</head>
<body>

  <h1>Happy Valentine's Day ❤️</h1>
  <p>You make every day brighter ✨</p>
  <button onclick="showMessage()">Click for a surprise 💝</button>

  <script>
    function showMessage() {
      alert("Will you be my Valentine? 💖");
    }

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 30 + 10 + "px";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
